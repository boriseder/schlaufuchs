<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Rechentürme & Zahlenmauern: Zarte 2px Linien, luftig -->
  <!-- Unterer linker Stein -->
  <rect x="5" y="25" width="18" height="15" rx="3" fill="#DCE8F6" stroke="#2D5E9E" stroke-width="2"/>
  <text x="14" y="35" font-family="'PrimaeText', sans-serif" font-size="9" font-weight="900" fill="#2D5E9E" text-anchor="middle">3</text>
  
  <!-- Unterer rechter Stein -->
  <rect x="25" y="25" width="18" height="15" rx="3" fill="#FFF7D6" stroke="#F2C14E" stroke-width="2"/>
  <text x="34" y="35" font-family="'PrimaeText', sans-serif" font-size="9" font-weight="900" fill="#B7950B" text-anchor="middle">2</text>
  
  <!-- Oberer Ziel-Stein -->
  <rect x="15" y="8" width="18" height="15" rx="3" fill="#F6E1D8" stroke="#B5502B" stroke-width="2"/>
  <text x="24" y="18" font-family="'PrimaeText', sans-serif" font-size="9" font-weight="900" fill="#B5502B" text-anchor="middle">5</text>
</svg>
