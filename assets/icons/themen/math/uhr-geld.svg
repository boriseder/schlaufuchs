<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Uhrzeit & Geld (Feine 2.1px Kontur, luftig) -->
  <!-- Zifferblatt Uhr -->
  <circle cx="19" cy="21" r="14.5" fill="#FFFFFF" stroke="#3B4651" stroke-width="2.1"/>
  <!-- Zeiger -->
  <line x1="19" y1="21" x2="19" y2="12" stroke="#B5502B" stroke-width="2" stroke-linecap="round"/>
  <line x1="19" y1="21" x2="26" y2="21" stroke="#2D5E9E" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="19" cy="21" r="1.8" fill="#3B4651"/>
  <!-- 1-Euro-Münze vorne rechts -->
  <circle cx="33" cy="33" r="9.5" fill="#F2C14E" stroke="#3B4651" stroke-width="2.1"/>
  <circle cx="33" cy="33" r="7.2" stroke="#3B4651" stroke-width="1" stroke-dasharray="2 1.5"/>
  <text x="33" y="37" font-family="'PrimaeText', sans-serif" font-size="10.5" font-weight="900" fill="#3B4651" text-anchor="middle">€</text>
</svg>
