<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Analoge Uhr: Klares Zifferblatt mit didaktischen Zeigern (Rot = Stunde, Blau = Minute) -->
  <circle cx="24" cy="24" r="19" fill="#FFFFFF" stroke="#3B4651" stroke-width="2.4"/>
  <!-- Teilstriche für 12, 3, 6, 9 -->
  <line x1="24" y1="7" x2="24" y2="10" stroke="#3B4651" stroke-width="2" stroke-linecap="round"/>
  <line x1="41" y1="24" x2="38" y2="24" stroke="#3B4651" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="41" x2="24" y2="38" stroke="#3B4651" stroke-width="2" stroke-linecap="round"/>
  <line x1="7" y1="24" x2="10" y2="24" stroke="#3B4651" stroke-width="2" stroke-linecap="round"/>
  <!-- Zeiger -->
  <!-- Kurzer roter Stundenzeiger auf ca. 2 Uhr -->
  <line x1="24" y1="24" x2="31" y2="14" stroke="#B5502B" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Langer blauer Minutenzeiger auf 12 Uhr -->
  <line x1="24" y1="24" x2="24" y2="10" stroke="#2D5E9E" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Mittelpunkt -->
  <circle cx="24" cy="24" r="2.2" fill="#3B4651"/>
</svg>
