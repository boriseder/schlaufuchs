<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Geld & Euro: Euro-Münzen mit Wertsymbole (flächig, 2.1px Kontur) -->
  <!-- Große 1-Euro-Münze (Mitte) -->
  <circle cx="21" cy="24" r="15.5" fill="#F2C14E" stroke="#3B4651" stroke-width="2.2"/>
  <circle cx="21" cy="24" r="10.5" fill="#FFFFFF" stroke="#3B4651" stroke-width="1.2"/>
  <text x="21" y="28" font-family="'PrimaeText', sans-serif" font-size="12" font-weight="900" fill="#3B4651" text-anchor="middle">€</text>
  <!-- Kleine 50-Cent-Münze rechts unten -->
  <circle cx="34" cy="33" r="9" fill="#F2C14E" stroke="#3B4651" stroke-width="2"/>
  <text x="34" y="36.5" font-family="'PrimaeText', sans-serif" font-size="8.5" font-weight="900" fill="#3B4651" text-anchor="middle">c</text>
</svg>
