<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Zwanzigerfeld: 2x5 Felder (Zehnerstreifen), Kraft der 5 -->
  <!-- Außenrahmen -->
  <rect x="5" y="11" width="38" height="26" rx="4" fill="#FFFFFF" stroke="#3B4651" stroke-width="2"/>
  <!-- Mittelteilung (Fünfer-Trennung) -->
  <line x1="24" y1="11" x2="24" y2="37" stroke="#3B4651" stroke-width="1.8" stroke-dasharray="2 2"/>
  <!-- Zeilentrennung horizontal -->
  <line x1="5" y1="24" x2="43" y2="24" stroke="#CBD5E1" stroke-width="1.2"/>
  
  <!-- Obere Reihe: 3 rote Plättchen links, 2 blaue rechts (Kraft der 5) -->
  <circle cx="9" cy="17.5" r="3.2" fill="#B5502B" stroke="#3B4651" stroke-width="1.2"/>
  <circle cx="15" cy="17.5" r="3.2" fill="#B5502B" stroke="#3B4651" stroke-width="1.2"/>
  <circle cx="21" cy="17.5" r="3.2" fill="#B5502B" stroke="#3B4651" stroke-width="1.2"/>
  <circle cx="27" cy="17.5" r="3.2" fill="#2D5E9E" stroke="#3B4651" stroke-width="1.2"/>
  <circle cx="33" cy="17.5" r="3.2" fill="#2D5E9E" stroke="#3B4651" stroke-width="1.2"/>
  
  <!-- Untere Reihe: 5 leere Platzhalter-Kreise -->
  <circle cx="9" cy="30.5" r="2.8" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2 1"/>
  <circle cx="15" cy="30.5" r="2.8" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2 1"/>
  <circle cx="21" cy="30.5" r="2.8" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2 1"/>
  <circle cx="27" cy="30.5" r="2.8" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2 1"/>
  <circle cx="33" cy="30.5" r="2.8" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2 1"/>
</svg>
