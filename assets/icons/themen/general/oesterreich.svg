<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Österreich: Offizielle rot-weiß-rote Flagge (Seitenverhältnis 2:3 nach B-VG Art. 8a) am Fahnenmast -->
  <!-- Fahnenmast links mit Zierknauf -->
  <line x1="10" y1="7" x2="10" y2="42" stroke="#3B4651" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="7" y1="42" x2="13" y2="42" stroke="#3B4651" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="10" cy="7" r="2.5" fill="#F2C14E" stroke="#3B4651" stroke-width="1.8"/>

  <!-- Flaggentuch (27x18 px, exaktes 2:3-Verhältnis) -->
  <!-- Grundform mit weißem Mittelstreifen -->
  <rect x="10" y="10" width="27" height="18" rx="1.5" fill="#FFFFFF" stroke="#3B4651" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Oberer roter Streifen (Höhe 6 px) -->
  <path d="M10 11.5 C10 10.7 10.7 10 11.5 10 L35.5 10 C36.3 10 37 10.7 37 11.5 L37 16 L10 16 Z" fill="#B5502B"/>
  
  <!-- Unterer roter Streifen (Höhe 6 px) -->
  <path d="M10 22 L37 22 L37 26.5 C37 27.3 36.3 28 35.5 28 L11.5 28 C10.7 28 10 27.3 10 26.5 Z" fill="#B5502B"/>

  <!-- Trennlinien der drei Querstreifen -->
  <line x1="10" y1="16" x2="37" y2="16" stroke="#3B4651" stroke-width="1.5"/>
  <line x1="10" y1="22" x2="37" y2="22" stroke="#3B4651" stroke-width="1.5"/>

  <!-- Außenkontur des Flaggentuchs für saubere 2px-Schulbuch-Optik -->
  <rect x="10" y="10" width="27" height="18" rx="1.5" fill="none" stroke="#3B4651" stroke-width="2" stroke-linejoin="round"/>

  <!-- Flaggenösen am Mast -->
  <circle cx="10" cy="12" r="1.2" fill="#3B4651"/>
  <circle cx="10" cy="26" r="1.2" fill="#3B4651"/>
</svg>