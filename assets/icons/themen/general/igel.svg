<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Tiere im Winter: Freundlicher Igel mit hellem Gesichtchen & Apfel -->
  <!-- Stachelkleid hinten (Warmes Kastanienbraun) -->
  <path d="M12 35 C10 24 16 14 28 14 C38 14 43 23 43 35 Z" fill="#9C6B46" stroke="#3B4651" stroke-width="2" stroke-linejoin="round"/>
  <!-- Stachel-Zacken Kontur -->
  <path d="M15 28 L11 23 L16 23 L14 18 L20 19 L19 14 L25 16 L27 12 L32 15 L36 12 L37 17 L42 17 L40 23 L43 25 L40 30" 
        stroke="#3B4651" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Helles, freundliches Gesichtchen vorne -->
  <path d="M14 35 C13 32 12 30 9 29 C6 28 4 28.5 3 30 C4.5 32 7 34 14 35 Z" fill="#FBF7EE" stroke="#3B4651" stroke-width="1.8" stroke-linejoin="round"/>
  <ellipse cx="14" cy="31" rx="5" ry="4" fill="#FDF3E7"/>
  <!-- Kullerauge mit Glanzpunkt -->
  <circle cx="12" cy="29" r="1.8" fill="#1E2A36"/>
  <circle cx="11.5" cy="28.5" r="0.6" fill="#FFFFFF"/>
  <!-- Stupsnase vorne -->
  <circle cx="3.2" cy="29.2" r="1.3" fill="#1E2A36"/>
  <!-- Kleiner roter Apfel auf dem Rücken -->
  <circle cx="28" cy="18" r="4.2" fill="#B5502B" stroke="#3B4651" stroke-width="1.6"/>
  <path d="M28 14 C29 12 31 12 31 12" stroke="#2F7A4F" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Pfötchen unten -->
  <ellipse cx="18" cy="35.5" rx="2.5" ry="1.5" fill="#FDF3E7" stroke="#3B4651" stroke-width="1.4"/>
  <ellipse cx="34" cy="35.5" rx="2.5" ry="1.5" fill="#FDF3E7" stroke="#3B4651" stroke-width="1.4"/>
</svg>
