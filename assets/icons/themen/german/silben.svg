  <text x="14.5" y="21" font-family="'PrimaeText', sans-serif" font-size="8" font-weight="bold" fill="#3B4651" text-anchor="middle">Schu</text>
  
  <rect x="26" y="11" width="15" height="14" rx="2.5" fill="#FFFFFF" stroke="#3B4651" stroke-width="1.8"/>
